[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "case1-oracle-adapter"
version = "0.1.0"
description = "Isolated, contract-driven Oracle and Landmark adaptation research"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.scripts]
oracle-adapter = "oracle.entrypoints:main"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["oracle.configs.local", "oracle.configs.local.*"]

[tool.setuptools.package-data]
oracle = ["configs/**/*.json"]

[tool.setuptools.exclude-package-data]
oracle = ["configs/local/*", "configs/local/**/*"]
