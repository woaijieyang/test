name: HAMLET CPU verification
on:
  push:
    branches: [HAMLET-v2]
    paths:
      - 'src/awarevln_memory/**'
      - 'src/hamlet_v2/**'
      - 'src/llava/train/train_hamlet.py'
      - 'tests/hamlet/**'
      - 'tests/hamlet_training/**'
      - 'configs/hamlet/training/**'
      - '.github/workflows/hamlet-cpu.yml'
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated CPU test dependencies
        run: |
          python -m pip install torch==2.3.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.37.2 accelerate==0.27.2 tokenizers==0.15.2 huggingface-hub==0.25.2 safetensors==0.8.0 'numpy<2' pytest PyYAML Pillow
      - name: Check syntax and run CPU regression tests
        env:
          PYTHONPATH: src
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python -m compileall -q src/awarevln_memory src/hamlet_v2
          test_dirs=(tests/hamlet)
          if [ -d tests/hamlet_training ]; then test_dirs+=(tests/hamlet_training); fi
          python -m pytest "${test_dirs[@]}" -q --junitxml=cpu-tests.xml
      - name: Export reviewed source and portable test dependencies
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/hamlet-dependencies"
          python -m pip download --no-deps -d "$RUNNER_TEMP/hamlet-dependencies" transformers==4.37.2 accelerate==0.27.2 tokenizers==0.15.2 huggingface-hub==0.25.2
          git archive --format=tar HEAD AGENTS.md README.md THIRD_PARTY.md src/awarevln_memory src/hamlet_v2 src/llava src/vlnce_baselines tests configs scripts tools > "$RUNNER_TEMP/hamlet-source.tar"
          sha256sum "$RUNNER_TEMP/hamlet-source.tar"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hamlet-cpu-source
          path: ${{ runner.temp }}/hamlet-source.tar
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hamlet-cpu-dependencies
          path: ${{ runner.temp }}/hamlet-dependencies/
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hamlet-cpu-test-report
          path: cpu-tests.xml
          retention-days: 7
          if-no-files-found: warn
