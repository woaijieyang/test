name: Isolated RxR integration and validation

on:
  push:
    branches: ['LLM-decompose-*']
    paths:
      - '.github/workflows/rxr-development.yml'
      - 'tools/**'
      - 'host/**'
      - 'shared/dataset_rules/rxr_en_us.md'
      - 'generator/dataset_rules/rxr_en_us.md'
      - 'reviewer/dataset_rules/rxr_en_us.md'
      - 'tests/test_rxr_calibration.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rxr-integration-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  BASE_COMMIT: cfd4c13010f105235d026ec14a9c2b4bbd7bf94e

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install existing validation dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare frozen baseline and exact scoped integration
        run: |
          git worktree add --detach "$RUNNER_TEMP/r2r-baseline" "$BASE_COMMIT"
          python -B tools/integrate_rxr.py
      - name: Verify official training source and build authored examples
        run: python -B tools/build_rxr_teaching.py --verify-upstream
      - name: Compile profiles and prove R2R isolation before refreshing pins
        run: |
          python -B -m host.compile
          python -B tools/check_r2r_isolation.py --baseline "$RUNNER_TEMP/r2r-baseline"
      - name: Refresh scoped asset manifests and verify complete package
        run: |
          python -B tools/refresh_rxr_integrity.py
          python -B verify_package.py
      - name: Run inherited and new self-contained regression tests
        run: |
          python -B - <<'PY'
          import json, os, unittest
          from pathlib import Path
          all_tests=unittest.defaultTestLoader.discover('tests')
          selected=unittest.TestSuite(); external=[]
          def collect(suite):
              for test in suite:
                  if isinstance(test,unittest.TestSuite): collect(test)
                  elif 'test_release_transaction' in test.id(): external.append(test.id())
                  else: selected.addTest(test)
          collect(all_tests)
          result=unittest.TextTestRunner(verbosity=2).run(selected)
          report={'tests_run':result.testsRun,'failures':len(result.failures),'errors':len(result.errors),
                  'skipped':len(result.skipped),'external_fixture_tests_not_run':external,
                  'navigation_evaluated':False,'semantic_correctness_certified':False}
          Path(os.environ['RUNNER_TEMP'],'rxr-tests.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report))
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
      - name: Exercise renderer and bounded workflow
        run: |
          python -B -m evaluation.smoke24
          python -B -m examples.demo
          python -B tools/check_r2r_isolation.py --baseline "$RUNNER_TEMP/r2r-baseline"
      - name: Record validation and refresh generated integrity
        run: |
          python -B - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads(Path(os.environ['RUNNER_TEMP'],'rxr-tests.json').read_text())
          report.update(source_commit=os.environ['GITHUB_SHA'],baseline_commit=os.environ['BASE_COMMIT'],
                        source_archive_verified=True,r2r_prompt_schema_selection_equal=True,
                        common_and_r2r_assets_equal=True)
          Path('provenance/rxr_validation.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
          python -B tools/refresh_rxr_integrity.py
          python -B verify_package.py
      - name: Commit only tested integration assets with a branch-head lease
        run: |
          current=$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          test "$current" = "$GITHUB_SHA" || { echo 'Branch advanced; do not overwrite concurrent work'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md host/template_selector.py host/run.py tools/integrate_rxr.py tools/build_rxr_teaching.py tools/rxr_lesson_specs.py tests/test_closed_loop_35.py tests/test_rxr_profile.py generator/templates_manifest.json reviewer/templates_manifest.json generator/templates/RxR/train reviewer/templates/RxR/train provenance/rxr_training_sources.json provenance/rxr_validation.json provenance/rxr_profile_integrity.json FILE_HASHES.json generator/compiled_r2r-en.txt generator/compiled_repair_r2r-en.txt reviewer/compiled_r2r-en.txt generator/compiled_rxr-en-us.txt generator/compiled_repair_rxr-en-us.txt reviewer/compiled_rxr-en-us.txt generator/templates/INDEX.md reviewer/templates/INDEX.md provenance/build_manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Integrate verified RxR lessons and tested profile-scoped runtime assets'
            git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          fi
          test -z "$(git status --porcelain)" || { git status --short; exit 1; }
          python -B verify_package.py
          git rev-parse HEAD
