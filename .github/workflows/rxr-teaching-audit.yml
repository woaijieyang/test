name: RxR teaching contract audit

on:
  push:
    branches: ['LLM-decompose-*']
    paths:
      - '.github/workflows/rxr-teaching-audit.yml'
      - 'generator/templates/RxR/**'
      - 'reviewer/templates/RxR/**'
      - 'tools/**'
      - 'tests/test_rxr_teaching*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rxr-teaching-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact candidate and frozen source history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install repository dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate the same authored output used by the materializer
        run: python -B tools/build_rxr_reviewed.py --inspect
      - name: Prove the audit did not change the worktree
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
