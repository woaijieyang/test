name: RxR teaching contract audit

on:
  push:
    branches: ['LLM-decompose-*']
    paths:
      - '.github/workflows/rxr-teaching-audit.yml'
      - 'generator/templates/RxR/**'
      - 'reviewer/templates/RxR/**'
      - 'tools/**'
      - 'tests/test_rxr_teaching*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rxr-teaching-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install repository dependencies
        run: python -m pip install -r requirements.txt
      - name: Inspect actual active teaching and runtime projection
        run: |
          python -B - <<'PY'
          import collections, difflib, json
          from host.compile import core_library, runtime_review_output, teaching_card
          from host.template_selector import library
          from host import protocol
          def emit(kind, value):
              print(kind + '|' + json.dumps(value, ensure_ascii=False, separators=(',', ':')))
          rows = {role: core_library(role, 'rxr-en-us') + library(role, 'rxr-en-us') for role in ('generator', 'reviewer')}
          problems = []
          for role, cases in rows.items():
              for case in cases:
                  src = case['input']['original_instruction'] if role == 'generator' else case['review_input']['original_instruction']
                  try:
                      if role == 'generator':
                          protocol.generator(src, case['output'])
                      else:
                          protocol.reviewer(src, case['review_input']['candidate'], runtime_review_output(case))
                  except Exception as exc:
                      problems.append({'id': case['template_id'], 'error': str(exc)})
                  for detail in (True, False):
                      teaching_card(case, role, detail)
          emit('SUMMARY', {'counts': {r: len(c) for r,c in rows.items()}, 'mechanical_contract_issues': problems, 'semantic_correctness_certified': False})
          for case in rows['generator']:
              emit('GEN', {'id': case['template_id'], 'source': case['input']['original_instruction'], 'stages': case['output']['subtasks'], 'audit': [{'ending': a['ending'], 'target': a['target'], 'conditions': a['conditions']} for a in case['output']['stage_audit']]})
          for case in rows['reviewer']:
              if 'DIAG' not in case['template_id']:
                  continue
              src = case['review_input']['original_instruction']; cand = '\n'.join(case['review_input']['candidate']['subtasks'])
              delta = [{'op': op, 'source': src[a:b], 'candidate': cand[c:d]} for op,a,b,c,d in difflib.SequenceMatcher(None, src, cand, autojunk=False).get_opcodes() if op != 'equal']
              emit('DIAG', {'id': case['template_id'], 'source': src, 'stages': case['review_input']['candidate']['subtasks'], 'delta': delta, 'findings': case['expected_review']['findings']})
          emit('HANDOFFS', [{'id': r['template_id'], 'coverage': [{k: c[k] for k in ('requirement_id','source_quote','candidate_evidence')} for c in r['expected_review'].get('source_coverage',[])], 'handoffs': r['expected_review'].get('handoffs',[])} for r in rows['reviewer'] if r['template_id'].startswith('RxR-REV-') and 'TRAIN' not in r['template_id']])
          PY
