name: Inspect rule-only completion on isolated work branch
on:
  push:
    branches: [rxr-rule-completion-work]
permissions:
  contents: write
concurrency:
  group: rxr-rule-completion-work
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Materialize only the reviewed additions and non-runtime locks
        run: python -B tools/_rxr_rule_completion_author.py
      - name: Prove protected boundaries before considering new prompt pins
        run: |
          python -B -m unittest tests.test_rxr_rule_lock -v
          python -B tools/check_profile_integration.py --runtime
          python -B tools/build_rxr_reviewed.py --check
          python -B tools/build_rxr_teaching.py --check
          python -B -m tools.r2r_authoring.build --check
          git diff --check
      - name: Save measured rules on the isolated branch only
        run: |
          test "$GITHUB_REF_NAME" = rxr-rule-completion-work
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generator/dataset_rules/rxr_en_us.md reviewer/dataset_rules/rxr_en_us.md provenance/rxr_rule_lock.json provenance/rxr_role_conversion.json provenance/rxr_rule_measurements.json
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          git commit -m 'Materialize reviewed RxR rule operations and non-runtime evidence locks'
          test "$(git ls-remote origin refs/heads/rxr-rule-completion-work | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/rxr-rule-completion-work
