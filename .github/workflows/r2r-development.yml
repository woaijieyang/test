name: R2R isolated authoring and validation
on:
  push:
    branches: ['LLM-decompose-*']
    paths:
      - '.github/workflows/r2r-development.yml'
      - 'tools/r2r_authoring/**'
      - 'host/r2r/**'
      - 'tests/r2r/**'
      - 'tests/__init__.py'
      - 'generator/templates/R2R/**'
      - 'reviewer/templates/R2R/**'
      - 'generator/dataset_rules/r2r_en.md'
      - 'reviewer/dataset_rules/r2r_en.md'
      - 'shared/dataset_rules/r2r*'
      - 'host/compile.py'
      - 'host/template_selector.py'
      - 'host/run.py'
      - 'tests/test_r2r*'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: r2r-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Verify parent ancestry and materialize only reviewed changes
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 081db4b9ea0712ff720c137fe96c240c26f7b15c HEAD
          python -B -m tools.r2r_authoring.integrate --write
          python -B -m tools.r2r_authoring.build --write
          python -B -m tools.r2r_authoring.test_expectations --write
          python -B -m tools.r2r_authoring.integrate
          python -B -m tools.r2r_authoring.build --check
          python -B -m tools.r2r_authoring.test_expectations
          python -B -m host.compile
      - name: Compare parent RxR inputs and mixed-profile behavior
        run: python -B -m tools.r2r_authoring.verify --isolation
      - name: Audit source-only selection and exact teaching injection
        run: python -B -m tools.r2r_authoring.audit
      - name: Verify current candidate integrity
        run: |
          python -B -m tools.r2r_authoring.verify --refresh
          python -B tools/verify_package.py
      - name: Run all repository tests and complete four-phase replay
        run: python -B -m tools.r2r_authoring.regression
      - name: Run Renderer smoke, integration demo and repeat compilation
        run: python -B -m tools.r2r_authoring.smoke
      - name: Verify final manifests after all result records are written
        run: |
          python -B -m tools.r2r_authoring.verify --refresh
          python -B tools/verify_package.py
          git diff --check
      - name: Recheck a clean candidate commit and publish without force
        if: github.event_name == 'push'
        run: python -B -m tools.r2r_authoring.publish
      - name: Save validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r2r-validation-evidence
          path: |
            provenance/r2r_regression_results.json
            provenance/r2r_parent_isolation.json
            provenance/r2r_teaching_changes.json
            provenance/r2r_rule_links.json
            provenance/r2r_smoke_results.json
            provenance/r2r_selection_audit.json
            provenance/r2r_issue_ledger.json
          retention-days: 7
