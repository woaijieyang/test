name: R2R isolated authoring and validation
on:
  push:
    branches: ['LLM-decompose-*']
    paths: ['.github/workflows/r2r-development.yml', 'r2r_authoring/**', 'r2r/**']
permissions:
  contents: read
concurrency:
  group: r2r-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Materialize only explicit R2R integration and reviewed assets
        run: |
          set -euo pipefail
          python -B -m r2r_authoring.integrate --write
          python -B -m r2r_authoring.build --write
          python -B -m r2r_authoring.integrate
          python -B -m r2r_authoring.build --check
          python -B -m host.compile
      - name: Compare actual parent RxR inputs and mixed-profile behavior
        run: python -B -m r2r_authoring.verify --isolation
      - name: Refresh and verify candidate integrity
        run: |
          python -B -m r2r_authoring.verify --refresh
          python -B verify_package.py
      - name: Run complete regression and actual four-phase mock workflows
        run: python -B -m r2r_authoring.regression
      - name: Save validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2r-validation-evidence
          path: |
            provenance/r2r_regression_results.json
            provenance/r2r_parent_isolation.json
            provenance/r2r_teaching_changes.json
          retention-days: 7
