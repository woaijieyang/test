name: R2R isolated authoring and validation
on:
  push:
    branches: ['LLM-decompose-*']
    paths: ['.github/workflows/r2r-development.yml', 'r2r_authoring/**', 'r2r/**']
permissions:
  contents: read
concurrency:
  group: r2r-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Validate all authored examples with current runtime contracts
        shell: bash
        run: |
          set -euo pipefail
          python -B -m r2r_authoring.build --write
          python -B -m r2r_authoring.build --check
