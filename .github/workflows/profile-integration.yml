name: Combined profiles and complete teaching validation
on:
  push:
    branches: [profile-integration-work, LLM-decompose-v6.6.5]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: combined-profiles-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/profile-integration-work'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      tested_sha: ${{ steps.publish.outputs.tested_sha }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Independent comparison before updating derived artifacts
        run: |
          python -B -m host.compile
          python -B tools/check_profile_integration.py --runtime --output provenance/profile_integration_checks.json
          python -B tools/build_rxr_reviewed.py --check
          python -B tools/build_rxr_teaching.py --check
          python -B -m tools.r2r_authoring.build --check
          python -B tools/refresh_profile_integrity.py --write
          python -B tools/verify_package.py
      - name: Run complete regressions before staging publication
        run: |
          python -B tools/run_profile_validation.py --report provenance/profile_integration_validation.json
          python -B -m evaluation.smoke24
          python -B -m examples.demo
          python -B tools/refresh_profile_integrity.py --write
          python -B tools/verify_package.py
          git diff --check
      - name: Publish tested derived artifacts to isolated branch only
        id: publish
        run: |
          test "$GITHUB_REF_NAME" = profile-integration-work
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test -z "$(git diff --name-only -- .github/workflows host generator/dataset_rules reviewer/dataset_rules tools tests)"
          git add FILE_HASHES.json provenance generator/compiled_r2r-en.txt generator/compiled_repair_r2r-en.txt reviewer/compiled_r2r-en.txt generator/compiled_rxr-en-us.txt generator/compiled_repair_rxr-en-us.txt reviewer/compiled_rxr-en-us.txt generator/templates/INDEX.md reviewer/templates/INDEX.md evaluation/renderer_smoke24.json
          if ! git diff --cached --quiet; then git commit -m 'Record clean dual-profile integration and complete regression verification'; fi
          test -z "$(git status --porcelain)"
          test "$(git ls-remote origin refs/heads/profile-integration-work | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/profile-integration-work
          echo "tested_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  validate:
    needs: prepare
    if: always() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout the exact committed candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tested_sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Verify committed package and deterministic complete teaching
        run: |
          python -B tools/verify_package.py
          python -B tools/refresh_profile_integrity.py
          python -B -m host.compile
          python -B tools/build_rxr_reviewed.py --check
          python -B tools/build_rxr_teaching.py --check
          python -B -m tools.r2r_authoring.build --check
          python -B tools/check_profile_integration.py --runtime
      - name: Independently rerun every available test and workflow fixture
        run: |
          python -B tools/run_profile_validation.py --report "$RUNNER_TEMP/combined-tests.json"
          python -B -m evaluation.smoke24
          python -B -m examples.demo
      - name: Prove validation did not alter the candidate
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
          python -B tools/verify_package.py
