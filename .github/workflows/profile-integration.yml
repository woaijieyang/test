name: Inspect and validate profile integration
on:
  push:
    branches: [profile-integration-work]
permissions:
  contents: write
concurrency:
  group: profile-integration-work
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Apply reviewed expectation migration once
        run: |
          if test -f tools/finalize_profile_checks.py; then
            python -B tools/finalize_profile_checks.py
            git rm tools/finalize_profile_checks.py
          fi
          python -B -m host.compile > "$RUNNER_TEMP/compiled.json"
      - name: Independent asset, full-input and dual-worktree verification
        run: |
          python -B tools/check_profile_integration.py --runtime --output provenance/profile_integration_checks.json
          python -B tools/build_rxr_reviewed.py --check
          python -B tools/build_rxr_teaching.py --check
          python -B -m tools.r2r_authoring.build --check
          python -B -m evaluation.smoke24
          python -B -m examples.demo
      - name: Refresh actual manifests after independent comparison
        run: |
          cat > "$RUNNER_TEMP/refresh.py" <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          for name in ('r2r','rxr'):
              path=Path('provenance/'+name+'_profile_integrity.json')
              data=json.loads(path.read_bytes())
              for row in data['files']:
                  p=Path(row['path'])
                  if not p.is_file():raise ValueError('Manifest path absent: '+str(p))
                  raw=p.read_bytes();row['git_blob_sha1']=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          names=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          names+=subprocess.check_output(['git','ls-files','--others','--exclude-standard','-z']).decode().split('\0')
          hashes={}
          for name in sorted(set(names)):
              p=Path(name)
              if not name or name=='FILE_HASHES.json' or not p.is_file():continue
              raw=p.read_bytes();hashes[name]='gitblob-sha1:'+hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          Path('FILE_HASHES.json').write_text(json.dumps(hashes,ensure_ascii=False,indent=2)+'\n')
          PY
          python -B "$RUNNER_TEMP/refresh.py"
          python -B tools/verify_package.py
      - name: All inherited and integrated tests without masking failures
        run: |
          python -B - <<'PY'
          import json,sys,unittest,os
          from pathlib import Path
          sys.path.insert(0,str(Path('tests').resolve()))
          selected=unittest.TestSuite();external=[]
          def add(s):
              for t in s:
                  if isinstance(t,unittest.TestSuite):add(t);continue
                  e=str(getattr(t,'_exception',''))
                  if t.id().endswith('.test_release_transaction') and 'manage_release.py' in e and 'FileNotFoundError' in e:
                      external.append({'test':t.id(),'reason':'Missing external manage_release.py; not counted as passed.'})
                  else:selected.addTest(t)
          add(unittest.defaultTestLoader.discover('tests',top_level_dir='.'))
          result=unittest.TextTestRunner(verbosity=1).run(selected)
          report={'tests_run':result.testsRun,'failures':[{'test':str(t),'traceback':e} for t,e in result.failures], 'errors':[{'test':str(t),'traceback':e} for t,e in result.errors], 'skipped':[(str(t),reason) for t,reason in result.skipped], 'external_fixture_tests_not_run':external,'success':result.wasSuccessful(),'workflow_run':os.environ['GITHUB_RUN_ID'],'source_commit':os.environ['GITHUB_SHA'],'navigation_evaluated':False,'live_provider_evaluated':False}
          Path('provenance/profile_integration_validation.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          print('FAILED_TESTS='+json.dumps([x['test'] for x in report['failures']+report['errors']]))
          PY
      - name: Preserve tested work branch only and report actual outcome
        run: |
          python -B "$RUNNER_TEMP/refresh.py"
          python -B tools/verify_package.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Record dual-baseline integration verification and full teaching tests'
          test "$(git ls-remote origin refs/heads/profile-integration-work | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/profile-integration-work
          python - <<'PY'
          import json
          r=json.load(open('provenance/profile_integration_validation.json'))
          raise SystemExit(0 if r['success'] else 1)
          PY
