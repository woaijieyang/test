name: Inspect and validate profile integration
on:
  push:
    branches: [profile-integration-work]
permissions:
  contents: write
concurrency:
  group: profile-integration-work
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SOURCE_COMMIT: 33d66756de8d545db001f3854194bf5d5b5a8592
      TARGET_COMMIT: b69e04ddc7097b47f8d201beed2fa5e2d9ffd34e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Inspect exact source and target trees without editing runtime
        run: |
          python -B - <<'PY'
          import json,os,subprocess,tempfile
          from pathlib import Path
          S=os.environ['SOURCE_COMMIT']; T=os.environ['TARGET_COMMIT']
          def git(*a): return subprocess.check_output(['git',*a])
          M=git('merge-base',S,T).decode().strip()
          def tree(ref):
              out={}
              for row in git('ls-tree','-rz',ref).split(b'\0'):
                  if not row: continue
                  meta,path=row.split(b'\t',1); mode,kind,sha=meta.decode().split()
                  out[path.decode()]={'mode':mode,'sha':sha}
              return out
          st,tt,mt=tree(S),tree(T),tree(M)
          diff=[]; previews={}
          for path in sorted(set(st)|set(tt)):
              if st.get(path)==tt.get(path):continue
              scope='rxr' if 'rxr' in path.lower() else 'r2r' if 'r2r' in path.lower() else 'common'
              s,t,m=st.get(path),tt.get(path),mt.get(path)
              action='preserve_rxr' if scope=='rxr' else 'import_source' if s else 'remove_or_reconcile'
              both=s!=m and t!=m
              diff.append(dict(path=path,scope=scope,source=s,target=t,merge_base=m,both_changed=both,proposed_action=action))
              if both and scope=='common' and path not in ('FILE_HASHES.json','provenance/build_manifest.json') and not path.startswith(('archive/','provenance/')):
                  if s and t and m:
                      with tempfile.TemporaryDirectory() as d:
                          ps=[Path(d)/x for x in ('target','base','source')]
                          for p,ref in zip(ps,(T,M,S)):p.write_bytes(git('show',ref+':'+path))
                          r=subprocess.run(['git','merge-file','-p',*map(str,ps)],capture_output=True)
                          previews[path]={'returncode':r.returncode,'merged':r.stdout.decode()}
                  else:previews[path]={'needs_explicit_resolution':True}
          Path('provenance/profile_migration_inventory.json').write_text(json.dumps(dict(source_commit=S,target_commit=T,merge_base=M,differences=diff),indent=2)+'\n')
          Path('provenance/profile_merge_preview.json').write_text(json.dumps(previews,indent=2)+'\n')
          print(json.dumps({'differences':len(diff),'common_both_changed':{p:{k:v for k,v in r.items() if k!='merged'} for p,r in previews.items()},'source_commit':S,'target_commit':T},indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add provenance/profile_migration_inventory.json provenance/profile_merge_preview.json
          git commit -m 'Inventory both exact profile trees before integration'
          test "$(git ls-remote origin refs/heads/profile-integration-work | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/profile-integration-work
